name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Generation and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned tools
        run: npm ci

      - name: Generate the outputs twice and compare
        run: |
          npm run build
          cp dist/manifest.json "$RUNNER_TEMP/first-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/first-manifest.json" dist/manifest.json

      # The build rewrites DESIGN.md at the root, so any difference from the commit means the
      # committed file is outdated.
      - name: Compare DESIGN.md with the committed one
        run: |
          if [ -n "$(git status --porcelain -- DESIGN.md)" ]; then
            git diff -- DESIGN.md
            echo "::error file=DESIGN.md::DESIGN.md is outdated; run npm run build and commit it"
            exit 1
          fi

      - name: Check
        run: npm run check

  package:
    name: Package consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proof/package-lock.json

      - name: Install the pinned tools and Playwright
        run: |
          npm ci
          cd proof
          npm ci
          npx playwright install --with-deps chromium

      - name: Check the proof consumer types
        run: npx tsc -p proof

      - name: Pack the package
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Check the packed package as a consumer
        run: node proof/consumer.ts --package "$RUNNER_TEMP"/bubbacore-elvis-*.tgz --out "$RUNNER_TEMP/proof-results"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-packed
          path: ${{ runner.temp }}/proof-results
          if-no-files-found: ignore
