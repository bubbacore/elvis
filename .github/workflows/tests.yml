name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Generation and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned tools
        run: npm ci

      - name: Generate the outputs twice and compare
        run: |
          npm run build
          cp dist/manifest.json "$RUNNER_TEMP/first-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/first-manifest.json" dist/manifest.json

      - name: Check
        run: npm run check
