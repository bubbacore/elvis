name: Release

# The npm trusted publisher is bound to this file, so every publication of @bubbacore/elvis, the
# releases and the test versions, runs here.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      proof:
        description: Test version number N, published as 0.0.0-proof.N with the dist-tag proof
        required: true
        type: number

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: Publish the release to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install the pinned tools
        run: npm ci

      - name: Generate and check
        run: |
          npm run build
          npm run check

      - name: Publish to npm and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/publish.ts --tag latest --release "$RELEASE"

  proof-release:
    name: Proof consumer
    needs: [release-please, publish-release]
    uses: ./.github/workflows/proof.yml
    with:
      version: ${{ needs.release-please.outputs.version }}

  publish-test:
    name: Publish a test version to npm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install the pinned tools
        run: npm ci

      - id: version
        name: Set the test version
        env:
          PROOF: ${{ inputs.proof }}
        run: |
          version="0.0.0-proof.$PROOF"
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate and check
        run: |
          npm run build
          npm run check

      - name: Publish to npm
        run: node scripts/publish.ts --tag proof

  proof-test:
    name: Proof consumer
    needs: publish-test
    uses: ./.github/workflows/proof.yml
    with:
      version: ${{ needs.publish-test.outputs.version }}
